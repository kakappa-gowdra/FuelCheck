<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00613A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuel Demo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Highway Fuel Assist: Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFEA;--surface:#FFFFFF;--surface-2:#E2E6DF;--text:#1D2125;--muted:#565F67;--line:#CCD3C9;
  --sign:#00613A;--sign-ink:#FFFFFF;--amber:#FFB81C;--amber-ink:#1D2125;--asphalt:#30353A;
  --danger:#B3261E;--danger-bg:#FBE9E7;--ok-bg:#E1F0E6;--warn-bg:#FFF3D6;
  --map:#D5DCCF;--map-2:#C8D2BF;--focus:#1A5FD1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181B;--surface:#1F2327;--surface-2:#2A2F34;--text:#E9ECE7;--muted:#9CA5AB;--line:#363C42;
    --sign:#0C7A4A;--amber:#FFBE2E;--asphalt:#454B51;--danger:#F2766B;--danger-bg:#3A1F1C;
    --ok-bg:#163021;--warn-bg:#3A2F12;--map:#252B29;--map-2:#1F2523;--focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B;--surface:#1F2327;--surface-2:#2A2F34;--text:#E9ECE7;--muted:#9CA5AB;--line:#363C42;
  --sign:#0C7A4A;--amber:#FFBE2E;--asphalt:#454B51;--danger:#F2766B;--danger-bg:#3A1F1C;
  --ok-bg:#163021;--warn-bg:#3A2F12;--map:#252B29;--map-2:#1F2523;--focus:#7FB0FF;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Overpass',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.15;margin:0}
p{margin:0}
.ic{flex:none;display:block}

#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative}
#app.wide{max-width:1100px}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sign);color:var(--sign-ink)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--amber-ink)}
.brand b{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:.78rem;opacity:.85}
.demo-tag{font-size:.72rem;font-weight:700;border:1.5px solid currentColor;border-radius:999px;padding:2px 9px;opacity:.9}
.top-btn{background:transparent;border:0;color:inherit;padding:6px;border-radius:8px;cursor:pointer}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.offline{background:var(--danger);color:#fff;font-size:.88rem;padding:8px 16px;font-weight:600}

nav.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--sign)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--amber)}}

.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.h-lg{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.h-md{font-size:1.12rem;font-weight:700}
.section-title{font-size:1rem;font-weight:700;margin:22px 0 8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.flat{background:transparent}
.card+.card{margin-top:10px}
.divider{height:1px;background:var(--line);margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem;background:var(--surface-2);color:var(--text)}
.btn.block{display:flex;width:100%}
.btn.primary{background:var(--sign);color:var(--sign-ink)}
.btn.amber{background:var(--amber);color:var(--amber-ink)}
.btn.outline{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--sign);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:root[data-theme="dark"] .link{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--amber)}}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* The one bold element: the highway-sign call to action */
.sign{display:block;width:100%;background:var(--amber);color:var(--amber-ink);border:0;border-radius:16px;padding:7px;cursor:pointer;text-align:left}
.sign-in{border:3px solid var(--amber-ink);border-radius:11px;padding:22px 18px;display:flex;align-items:center;gap:16px}
.sign-in .ic{width:52px;height:52px}
.sign strong{display:block;font-size:2.1rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.sign span{display:block;margin-top:6px;font-size:.95rem;font-weight:600}
.sign:active{transform:translateY(1px)}

/* Green route-sign plate for locations */
.plate{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:5px}
.plate-in{border:2px solid var(--sign-ink);border-radius:8px;padding:10px 12px}
.plate small{display:block;font-size:.78rem;opacity:.85}
.plate b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.plate p{font-size:.92rem}

.field{display:block}
.field>span{display:block;font-weight:700;font-size:.92rem;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:1rem}
.field textarea{min-height:80px;resize:vertical}
.field .err{color:var(--danger);font-size:.86rem;font-weight:600;margin-top:4px}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--danger)}
.fields>*+*{margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.opt{min-height:56px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;padding:8px}
.opt[aria-pressed="true"]{border-color:var(--sign);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--sign)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--sign);background:var(--sign);color:var(--sign-ink)}

.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.b-searching{background:var(--warn-bg)}
.b-active{background:var(--ok-bg);color:var(--sign)}
.b-completed{background:var(--sign);color:var(--sign-ink)}
.b-no_provider,.b-danger{background:var(--danger-bg);color:var(--danger)}
:root[data-theme="dark"] .b-active{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-active{color:var(--text)}}

.notice{border-radius:10px;padding:12px 14px;font-size:.92rem}
.notice.warn{background:var(--warn-bg)}
.notice.err{background:var(--danger-bg);color:var(--danger);font-weight:600}
.notice.ok{background:var(--ok-bg)}

.lines{width:100%;border-collapse:collapse}
.lines td{padding:6px 0}
.lines td:last-child{text-align:right;font-weight:600}
.lines tr.total td{border-top:2px solid var(--line);padding-top:10px;font-weight:800;font-size:1.1rem}

.stepper{list-style:none;padding:0;margin:0}
.stepper li{display:flex;gap:12px;position:relative;padding-bottom:14px}
.stepper li:last-child{padding-bottom:0}
.stepper li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;z-index:1}
.stepper li.done .dot{background:var(--sign);border-color:var(--sign);color:#fff}
.stepper li.now .dot{border-color:var(--sign);box-shadow:0 0 0 4px var(--ok-bg)}
.stepper li.done::before{background:var(--sign)}
.stepper b{display:block;font-weight:700}

.progress{display:flex;gap:6px;margin-bottom:14px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--sign)}

.list-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}

.map{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.map.tappable{cursor:crosshair}
.m-bg{fill:var(--map)}.m-patch{fill:var(--map-2)}
.hw-edge{fill:none;stroke:var(--asphalt);stroke-width:26;stroke-linecap:round;opacity:.35}
.hw{fill:none;stroke:var(--asphalt);stroke-width:22;stroke-linecap:round}
.hw-lane{fill:none;stroke:#F4F1D0;stroke-width:1.6;stroke-dasharray:8 9}
.road2{fill:none;stroke:var(--asphalt);stroke-width:8;stroke-linecap:round;opacity:.8}
.m-lbl{font-size:10px;font-weight:700;fill:var(--text)}
.m-note{font-size:9.5px;font-weight:600;fill:var(--muted)}
.shield{fill:var(--sign)}.shield-t{fill:#fff;font-size:10px;font-weight:800}
.cov{fill:var(--sign);opacity:.1;stroke:var(--sign);stroke-width:1.5;stroke-dasharray:4 4}
.route{fill:none;stroke:var(--sign);stroke-width:4;stroke-dasharray:2 7;stroke-linecap:round}
.pin{fill:var(--amber);stroke:var(--amber-ink);stroke-width:2}
.pin-dot{fill:var(--amber-ink)}
.prov-dot{fill:var(--sign);stroke:#fff;stroke-width:2}
.prov-halo{fill:var(--sign);opacity:.18}
.prov-ic{color:#fff}
.other{fill:var(--sign);stroke:#fff;stroke-width:1.5}
.radar{fill:none;stroke:var(--sign);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:radar 1.8s ease-out infinite}
@keyframes radar{from{transform:scale(.3);opacity:.9}to{transform:scale(5);opacity:0}}
@media (prefers-reduced-motion:reduce){.radar{animation:none;opacity:.5}}

.stars{display:flex;gap:6px}
.star{background:none;border:0;padding:4px;cursor:pointer;color:var(--line)}
.star[aria-pressed="true"]{color:var(--amber)}
.star[aria-pressed="true"] svg{fill:var(--amber)}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--sign)}
.switch input:checked::after{transform:translateX(22px)}
.switch input:disabled{opacity:.5}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.stat span{font-size:.86rem;color:var(--muted)}
.bars>div{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;font-size:.88rem;margin-top:8px}
.bars i{display:block;height:12px;border-radius:3px;background:var(--sign)}
.admin-grid{display:grid;gap:14px;align-items:start}.admin-grid>.card{margin-top:0}
.tbl td:first-child b{white-space:nowrap}
@media (min-width:860px){.admin-grid{grid-template-columns:1fr 1fr}}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:640px}
.tbl th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl select{min-height:36px;border-radius:8px;border:2px solid var(--line);background:var(--surface);padding:4px 6px}

.bubble{max-width:80%;padding:9px 12px;border-radius:12px;margin-top:8px;font-size:.95rem}
.bubble.me{margin-left:auto;background:var(--sign);color:#fff;border-bottom-right-radius:4px}
.bubble.them{background:var(--surface-2);border-bottom-left-radius:4px}

#modal:empty{display:none}
.backdrop{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:18px 16px 20px;max-height:88%;overflow-y:auto}
@media (min-width:600px){.backdrop{align-items:center}.sheet{border-radius:16px}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:.92rem;z-index:60;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast:empty{display:none}

.login{min-height:100%;display:flex;flex-direction:column;padding:28px 18px}
.login .sign{pointer-events:none;margin-bottom:26px}
.role-pick{display:grid;gap:10px}
.role-pick .opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px}
.role-pick .opt small{display:block;font-weight:400;color:var(--muted);font-size:.86rem}
.center{text-align:center}
.spin{width:22px;height:22px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.guide{flex:none;display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border-bottom:1px solid var(--line);padding:10px 16px;font-size:.92rem}
.guide b{font-weight:800}
.guide .grow{flex:1}
.guide button{flex:none}
.plate-btn{display:block;width:100%;border:0;cursor:pointer;text-align:left;font:inherit}
.plate-btn .plate-in{align-items:center;gap:14px}
.plate-btn .ic{width:34px;height:34px}
.land-note{font-size:.92rem;color:var(--muted)}
.play{display:flex;gap:14px;align-items:center;text-align:left}
.play small{display:block;font-weight:600;font-size:.86rem;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var KEY='hfa-proto-v1';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function usd(n){return '$'+(Number(n)||0).toFixed(2)}
function r2(n){return Math.round(n*100)/100}
function now(){return Date.now()}
function when(t){return new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}

var IC={
fuel:'<path d="M4 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15"/><path d="M3 20h12"/><path d="M6 8h6"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
truck:'<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
chat:'<path d="M4 5h16v11H9l-5 4z"/>',
pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
nav:'<path d="M3 11l18-8-8 18-2-8z"/>',
check:'<path d="M5 12l5 5 9-10"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>',
star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
wrench:'<path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/>',
swap:'<path d="M4 8h14l-4-4M20 16H6l4 4"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
back:'<path d="M15 5l-7 7 7 7"/>'
};
function ic(n,s){s=s||22;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}

var STATUS={searching:'Finding a provider',accepted:'Request accepted',travelling:'Provider on the way',arrived:'Provider arrived',on_trip:'Trip in progress',completed:'Service completed',cancelled:'Cancelled',no_provider:'No provider available'};
var LBL={fuel:{c:{accepted:'Request accepted',travelling:'Provider on the way',arrived:'Provider arrived',completed:'Service completed'},p:{accepted:'Request accepted',travelling:'Travelling to customer',arrived:'Arrived at location',completed:'Service completed'}},
 driver:{c:{accepted:'Driver confirmed',travelling:'Driver on the way',arrived:'Driver arrived',on_trip:'Trip in progress',completed:'Trip completed'},p:{accepted:'Booking accepted',travelling:'Travelling to pickup',arrived:'Arrived at pickup',on_trip:'Trip started',completed:'Trip completed'}}};
function svc(r){return (r&&r.service)||'fuel'}
function flowFor(r){return svc(r)==='driver'?['accepted','travelling','arrived','on_trip','completed']:['accepted','travelling','arrived','completed']}
function inProg(st){return st==='accepted'||st==='travelling'||st==='arrived'||st==='on_trip'}
function stLabel(r,who){return LBL[svc(r)][who||'c'][r.status]||STATUS[r.status]||r.status}

function eligible(radius,r,service){var sv=r?svc(r):(service||'fuel');return S.providers.filter(function(p){return p.verified==='approved'&&p.online&&p.dist<=radius&&(p.services||['fuel']).indexOf(sv)>=0&&!busy(p.id)&&(!r||r.rejectedBy.indexOf(p.id)<0)}).sort(function(a,b){return a.dist-b.dist})}

/* ---------- Simulation loop (demo only) ---------- */
function tick(){
  var ch=false,t=now();
  S.requests.forEach(function(r){
    var el=(t-r.updatedAt)/1000,drv=svc(r)==='driver';
    if(r.status==='travelling'&&r.eta>0&&el>=(TOUR?0.6:1.5)){r.eta--;r.updatedAt=t;ch=true;if(r.eta===0&&r.auto)setStatus(r,'arrived')}
    if(!r.auto)return;
    if(r.status==='searching'&&el>3){
      var list=(S.settings.noProviders&&!r.expanded)?[]:eligible(r.radius,r);
      if(!list.length){setStatus(r,'no_provider')}
      else{var p=list[0];r.providerId=p.id;r.dist=p.dist;r.eta=r.etaStart=etaFor(p.dist);setStatus(r,'accepted');if(S.role==='customer')toast(p.name+(drv?' will be your driver':' accepted your request'))}
      ch=true;
    }else if(r.status==='accepted'&&el>3){setStatus(r,'travelling');ch=true}
    else if(r.status==='arrived'&&el>(drv?4:6)){setStatus(r,drv?'on_trip':'completed');ch=true;if(!drv&&S.role==='customer')toast('Service completed. Please confirm payment.')}
    else if(r.status==='on_trip'&&el>(TOUR?7:12)){setStatus(r,'completed');ch=true;if(S.role==='customer')toast('Trip completed. Please confirm payment.')}
  });
  if(ch){save();var a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();if(MODAL&&MODAL.type==='chat')renderModal()}
}
setInterval(tick,1000);

  return '<div class="stack"><h1 class="h-lg">Activity</h1>'+(mine.length?'<div class="card">'+mine.map(function(r){return isActive(r.status)?'<button type="button" class="list-row" data-act="nav" data-to="live">'+ic(svcIcon(r))+'<span class="grow"><b>'+esc(title(r))+'</b><span class="small muted" style="display:block">In progress</span></span>'+badge(r.status,r)+'</button>':rowReq(r)}).join('')+'</div>':'<div class="card">No requests yet. Tap Get Fuel Now or Hire a Driver on Home.</div>')+'</div>';
}
function vSafety(){
  var steps=[['Get off the road','Move to the hard shoulder or the furthest safe spot from traffic. Never stop in a live lane if you can avoid it.'],['Make yourself visible','Turn on hazard lights. At night, keep sidelights on. Place a warning triangle only if you can do it safely.'],['Leave the vehicle safely','Get out on the side away from traffic. Wait behind the barrier or well up the verge with passengers.'],['Call for help','If anyone is hurt or you are in danger, call 911 or your local emergency number first.'],['Share your exact spot','Note the highway, direction, nearest exit and kilometer marker for responders.']];

}
function vProfile(){

function themeCard(){return '<div class="card"><div class="h-md" style="margin-bottom:8px">Appearance</div><div class="seg" role="group" aria-label="Theme">'+[['auto','Automatic'],['light','Light'],['dark','Dark']].map(function(t){return '<button type="button" class="opt" data-act="theme" data-v="'+t[0]+'" aria-pressed="'+(S.theme===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></div>'}

/* ---------- Provider ---------- */
function vJobs(){
  var p=me(),ok=p.verified==='approved',sv=p.services||['fuel'];
  var h='<div class="stack"><div class="card"><label class="switch"><span><b class="h-md">'+(p.online?'You are online':'You are offline')+'</b><br><span class="small muted">'+(p.online?'New nearby requests appear below':'Go online to receive requests')+'</span></span><input type="checkbox" data-act="toggleOnline"'+(p.online?' checked':'')+(ok?'':' disabled')+' aria-label="Online status"></label><p class="small muted" style="margin-top:8px">Services: '+sv.map(svcName).join(' and ')+'</p></div>';
  if(!ok)h+='<div class="notice warn"><b>Verification '+esc(p.verified)+'.</b> You can accept requests after your documents are approved. <button type="button" class="link" data-act="nav" data-to="account">Check documents</button></div>';
  var job=S.requests.filter(function(r){return r.providerId===p.id&&inProg(r.status)})[0];
  if(job){
    var drv=svc(job)==='driver',fl=flowFor(job),nx=fl[fl.indexOf(job.status)+1];
    var BTN=drv?{travelling:'Start travelling',arrived:'Mark arrived at pickup',on_trip:'Start trip',completed:'End trip'}:{travelling:'Start travelling',arrived:'Mark arrived',completed:'Complete service'};
    h+='<h2 class="section-title">Current job</h2><div class="card stack"><div class="spread"><b>'+esc(job.id)+'</b><span class="badge b-active">'+esc(stLabel(job,'p'))+'</span></div>';
    h+='<div class="plate"><div class="plate-in"><small>'+(drv?'Pickup':'Customer location')+'</small><b>'+esc((job.highway+' '+job.direction).trim())+'</b><p>'+esc(locText(job)||(job.lat+', '+job.lng))+'</p></div></div>';
    h+='<div><b>'+esc(title(job))+'</b><div class="small">'+esc(job.custName)+', '+esc(job.custPhone)+'</div><div class="small muted">'+esc(job.vehicle)+(drv?', '+esc(job.transmission):'')+'</div>'+(drv&&job.dest?'<div class="small">Destination: '+esc(job.dest)+'</div>':'')+(drv&&job.when==='later'&&job.at?'<div class="small">Scheduled: '+esc(when(new Date(job.at).getTime()))+'</div>':'')+(job.notes?'<div class="small" style="margin-top:4px">Note: '+esc(job.notes)+'</div>':'')+'</div>';
    h+=stepper(job,LBL[svc(job)].p)+(job.status==='travelling'?'<p class="small muted">About '+job.eta+' min to '+(drv?'pickup':'customer')+' (simulated)</p>':'');
    h+='<button type="button" class="btn amber block" data-act="advance" data-id="'+job.id+'" data-to="'+nx+'">'+BTN[nx]+'</button>';
    h+='<div class="btn-grid"><a class="btn outline" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+job.lat+','+job.lng+'">'+ic('nav')+'Navigate</a><a class="btn outline" href="tel:'+esc(job.custPhone.replace(/\s/g,''))+'">'+ic('phone')+'Call</a></div>';
    h+='<div class="btn-grid"><button type="button" class="btn outline" data-act="chat" data-id="'+job.id+'">'+ic('chat')+'Message</button><button type="button" class="btn outline" data-act="report" data-id="'+job.id+'">'+ic('alert')+'Report</button></div>';
    h+='<p class="small muted">'+(drv?'Confirm the customer\'s name before taking the keys. Drive within the law and follow the customer\'s route.':'Stop only in a safe, permitted place. Do not stop in a live lane.')+'</p></div>';
  }
  h+='<h2 class="section-title">Nearby requests</h2>';
  var inc=(p.online&&ok)?S.requests.filter(function(r){return r.status==='searching'&&r.rejectedBy.indexOf(p.id)<0&&sv.indexOf(svc(r))>=0}):[];
  if(!p.online||!ok)h+='<div class="card muted">'+(ok?'Go online to see nearby requests.':'Requests are shown once you are verified.')+'</div>';
  else if(!inc.length)h+='<div class="card muted">No requests nearby right now. New requests appear here while you are online.</div>';
  else inc.forEach(function(r){
    var drv=svc(r)==='driver';
    h+='<div class="card stack"><div class="spread"><b class="h-md">'+esc(title(r))+'</b><span class="badge b-searching">'+(drv?'Driver hire':'Fuel')+'</span></div><div class="small">'+(drv?'Pickup: ':'')+esc((r.highway+' '+r.direction).trim())+(locText(r)?', '+esc(locText(r)):'')+'</div>'+(drv&&r.dest?'<div class="small">To '+esc(r.dest)+', '+esc(r.transmission)+' gearbox</div>':drv?'<div class="small">'+esc(r.transmission)+' gearbox</div>':'')+'<div class="spread small"><span>About '+p.dist+' km away</span><span>Your earnings <b>'+usd(earn(r))+'</b></span></div><p class="small muted">Customer contact details are shared after you accept.</p>';
    h+='<div class="btn-grid"><button type="button" class="btn outline" data-act="reject" data-id="'+r.id+'">Decline</button><button type="button" class="btn primary" data-act="accept" data-id="'+r.id+'"'+(job?' disabled':'')+'>Accept</button></div>'+(job?'<p class="small muted">Finish your current job before accepting another.</p>':'')+'</div>';
  });
  return h+'</div>';
}

/* ---------- Admin ---------- */
function vOverview(){
  var R=S.requests,open=R.filter(function(r){return r.status==='searching'||r.status==='no_provider'}).length,act=R.filter(function(r){return inProg(r.status)}).length;
  var comp=R.filter(function(r){return r.status==='completed'}).length,canc=R.filter(function(r){return r.status==='cancelled'}).length,closed=comp+canc;
  var rev=R.reduce(function(s,r){return s+(r.payStatus==='paid'?r.total:0)+(r.cancelFee||0)},0);
  var h='<div class="stack"><h1 class="h-lg">Overview</h1><div class="stats"><div class="stat"><b>'+open+'</b><span>Open requests</span></div><div class="stat"><b>'+act+'</b><span>In progress</span></div><div class="stat"><b>'+(closed?Math.round(comp/closed*100):0)+'%</b><span>Completion rate</span></div><div class="stat"><b>'+(closed?Math.round(canc/closed*100):0)+'%</b><span>Cancellation rate</span></div><div class="stat"><b>'+usd(rev)+'</b><span>Payments collected (sample)</span></div><div class="stat"><b>'+S.providers.filter(function(p){return p.online&&p.verified==='approved'}).length+'</b><span>Providers online</span></div></div>';
  h+='<div class="admin-grid"><div class="card"><div class="h-md">Live requests</div>';
  var live=R.filter(function(r){return isActive(r.status)});
  h+=live.length?live.map(function(r){return '<div class="list-row" style="cursor:default"><span class="grow"><b>'+esc(r.id)+'</b> '+esc(r.custName)+'<span class="small muted" style="display:block">'+esc(title(r))+', '+esc((r.highway+' '+r.direction).trim())+(r.providerId?', '+esc(prov(r.providerId).name):'')+'</span></span>'+badge(r.status,r)+'</div>'}).join(''):'<p class="muted" style="margin-top:8px">No open or active requests.</p>';
  h+='</div><div class="card"><div class="h-md">Requests by status</div><div class="bars">';
  var max=1,cnt={};Object.keys(STATUS).forEach(function(k){cnt[k]=R.filter(function(r){return r.status===k}).length;max=Math.max(max,cnt[k])});
  Object.keys(STATUS).forEach(function(k){h+='<div><span>'+STATUS[k]+'</span><i style="width:'+(cnt[k]/max*100)+'%;'+(cnt[k]?'':'background:var(--line);width:4px')+'"></i><b>'+cnt[k]+'</b></div>'});
  return h+'</div></div></div></div>';
}

/* ---------- Modals ---------- */
function openModal(m){MODAL=m;renderModal()}
function closeModal(){MODAL=null;$('#modal').innerHTML=''}
function renderModal(){
  var el=$('#modal');if(!MODAL){el.innerHTML='';return}
  var h='<div class="backdrop" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">';
  if(MODAL.type==='confirm'){h+='<h2 id="mt" class="h-md">'+esc(MODAL.title)+'</h2><p style="margin:10px 0 16px">'+MODAL.body+'</p><div class="btn-grid"><button type="button" class="btn outline" data-act="closeModal">'+esc(MODAL.no||'Keep it')+'</button><button type="button" class="btn '+(MODAL.danger?'danger':'primary')+'" data-act="confirmOk">'+esc(MODAL.ok)+'</button></div>'}
  if(MODAL.type==='chat'){
    var r=find(MODAL.id),mineKey=S.role==='provider'?'p':'c',other=S.role==='provider'?r.custName:(prov(r.providerId)||{}).name;
    h+='<div class="spread"><h2 id="mt" class="h-md">Message '+esc(other)+'</h2><button type="button" class="top-btn" data-act="closeModal" aria-label="Close">'+ic('x')+'</button></div><div style="min-height:140px;margin:10px 0">'+(r.messages.length?r.messages.map(function(m){return '<div class="bubble '+(m.from===mineKey?'me':'them')+'">'+esc(m.text)+'</div>'}).join(''):'<p class="muted small">No messages yet. Messages are kept in this demo only.</p>')+'</div><div class="row"><label class="field" style="flex:1"><span class="sr">Message</span><input id="chatIn" placeholder="Type a message" autocomplete="off"></label><button type="button" class="btn primary" data-act="sendChat" data-id="'+r.id+'">Send</button></div>';

  }

  }

function confirmBox(o,fn){CONFIRM_FN=fn;o.type='confirm';openModal(o)}

/* ---------- Guided story ---------- */
function startTour(kind){
  var th=S.theme;S=seed();S.theme=th;S.role='customer';S.screen='home';S.settings.autopilot=true;S.payDecline=false;S.payMethod='card';save();
  var drv=kind==='driver';
  var first=drv?[
    [1800,'The customer does not feel fit to drive home, so they tap Hire a Driver.',function(){A.startDriver()}],
    [1800,'The app finds the pickup point. Here it uses a simulated position.',function(){A.detectLoc()}],
    [2400,'The pickup point is filled in. The customer continues.',function(){A.step1()}],
    [2000,'One way to Denver Union Station, 3 hours, automatic gearbox.',function(){var d=S.draft;d.tripType='One way';d.dest='Denver Union Station';d.hours=3;d.transmission='Automatic';render()}],
    [2000,'Next, the price.',function(){A.step2()}],
    [2800,'Driver time, booking fee and return travel are shown before booking.',function(){A.confirmReq()}],
    [function(){var r=active();return r&&r.status!=='searching'},'The booking goes to nearby verified drivers.',null],
    [function(){var r=active();return r&&r.status==='travelling'},'A driver accepts. The customer sees who is coming, with licence and background checked.',null],
    [function(){var r=active();return r&&r.status!=='travelling'},'The driver heads to the pickup point. Time is sped up for the demo.',null],
    [function(){var r=active();return r&&r.status==='on_trip'},'The driver arrives. The customer checks the name before handing over the keys.',null],
    [function(){var r=active();return r&&r.status==='completed'},'The trip is under way in the customer\'s own car.',null],
    [2500,'Trip complete. The customer checks the amount and pays.',function(){var r=active();A.pay({dataset:{id:r.id}})}]
  ]:[
    [1800,'The driver has run out of fuel on I-70 and taps Get Fuel Now.',function(){A.startRequest()}],
    [1800,'The app asks for location. Here it uses a simulated position.',function(){A.detectLoc()}],
    [2400,'Highway, direction and exit are filled in. The driver continues.',function(){A.step1()}],
    [1800,'The driver chooses petrol and 15 litres.',function(){S.draft.fuel='Petrol';S.draft.qty=15;render()}],
    [1800,'Next, the price summary.',function(){A.step2()}],
    [2600,'Fuel, service fee and distance fee are shown before confirming.',function(){A.confirmReq()}],
    [function(){var r=active();return r&&r.status!=='searching'},'The request goes to nearby verified providers.',null],
    [function(){var r=active();return r&&r.status==='travelling'},'A provider accepts. The driver sees who is coming and the arrival time.',null],
    [function(){var r=active();return r&&r.status!=='travelling'},'The provider drives to the customer. Time is sped up for the demo.',null],
    [function(){var r=active();return r&&r.status==='completed'},'The provider has arrived and delivers the fuel.',null],
    [2500,'Service complete. The driver checks the amount and pays.',function(){var r=active();A.pay({dataset:{id:r.id}})}]
  ];
  var steps=first.concat([
    [2200,'Payment confirmed (demo, no money moves). Now the rating.',function(){S.rateDraft=5;render()}],
    [2200,'Five stars, and it is saved in the history.',function(){var r=active();S.fbDraft=drv?'Careful driver, got me home safely.':'Quick and safe, thank you!';A.submitRating({dataset:{id:r.id}})}]
  ]);
  TOUR={i:0,cap:'Starting the demo',kind:kind};render();
  (function run(){
    if(!TOUR)return;
    if(TOUR.i>=steps.length){var k=TOUR.kind;TOUR=null;render();openModal({type:'tourEnd',kind:k});return}
    var st=steps[TOUR.i];TOUR.cap=st[1];render();
    if(typeof st[0]==='number'){setTimeout(function(){if(!TOUR)return;if(st[2])st[2]();TOUR.i++;run()},st[0])}
    else{var w=setInterval(function(){if(!TOUR){clearInterval(w);return}if(st[0]()){clearInterval(w);TOUR.i++;run()}},400)}
  })();
}
/* ---------- Actions ---------- */
function setPath(p,v){var k=p.split('.'),o=S;for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
var A={
  nav:function(el){S.screen=el.dataset.to;PAY=null;save();render();var m=$('#main');if(m)m.scrollTop=0},
  loginRole:function(el){LOGIN.role=el.dataset.role;render()},
  loginSend:function(){var v=$('#lid').value.trim();LOGIN.id=v;if(!/^(\+?[\d\s-]{7,}|[^@\s]+@[^@\s]+\.[^@\s]+)$/.test(v)){LOGIN.err='Enter a valid mobile number or email address.';return render()}LOGIN.err='';LOGIN.step=2;render()},
  loginVerify:function(){var c=$('#lcode').value.trim();if(c!=='123456'){LOGIN.code=c;LOGIN.err='That code is not correct. In this demo the code is 123456.';return render()}
    S.role=LOGIN.role;S.screen={customer:'home',provider:'jobs',admin:'overview'}[S.role];LOGIN={step:1,role:'customer',id:'',code:'',err:''};save();render()},
  loginBack:function(){LOGIN.step=1;LOGIN.err='';render()},
  switchRole:function(){S.role=null;save();closeModal();render()},
  signOut:function(){S.role=null;save();render()},
  startRequest:function(){startService('fuel')},
  startDriver:function(){startService('driver')},
  setDraft:function(el){var d=S.draft,k=el.dataset.k;d[k]=k==='hours'?Number(el.dataset.v):el.dataset.v;d.err[k]='';render()},
  reqBack:function(){var d=S.draft;if(d.step>1){d.step--;render()}else{S.draft=null;S.screen='home';save();render()}},
  mapTap:function(el,e){var svg=e.target.closest('svg'),b=svg.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*400,y=(e.clientY-b.top)/b.height*240,d=S.draft;
    d.px=Math.round(Math.max(16,Math.min(384,x)));d.py=Math.round(Math.max(36,Math.min(224,y)));var c=coords(d.px,d.py);d.lat=c.lat;d.lng=c.lng;d.located=true;d.mode='manual';d.locErr='';d.err.loc='';save();render()},
  detectLoc:function(){var d=S.draft;d.locating=true;d.locErr='';render();setTimeout(function(){if(!S.draft)return;d.locating=false;d.located=true;d.mode='gps';d.px=250;d.py=115;var c=coords(250,115);d.lat=c.lat;d.lng=c.lng;
    if(d.service==='driver'){if(!d.highway)d.highway='I-70 rest area, Exit 244';if(!d.landmark)d.landmark='Parking bay 4'}
    else{if(!d.highway)d.highway='I-70';if(!d.direction)d.direction='Eastbound';if(!d.exit)d.exit='Exit 244';if(!d.km)d.km='392'}
    d.err={};save();render();toast('Location filled from simulated GPS. Check the details.')},1200)},
  locFail:function(){var d=S.draft;d.located=false;d.locErr='Location unavailable. Permission may be denied or the signal is weak. Tap the map and enter the highway details below.';render()},
  step1:function(){var d=S.draft,drv=d.service==='driver';d.err={};if(!d.located)d.err.loc='Set your location: use your location or tap the map.';if(!d.highway.trim())d.err.highway=drv?'Enter the pickup address or highway.':'Enter the highway name.';if(!drv&&!d.direction)d.err.direction='Choose your direction of travel.';
    if(Object.keys(d.err).length){render();return toast('Check the highlighted fields')}d.step=2;save();render();$('#main').scrollTop=0},
  setFuel:function(el){S.draft.fuel=el.dataset.v;render()},
  setQty:function(el){S.draft.qty=Number(el.dataset.v);S.draft.err.qty='';render()},
  step2:function(){var d=S.draft,P=S.pricing;d.err={};
    if(d.service==='driver'){var hr=Number(d.hours);if(!(hr>=P.minHours&&hr<=P.maxHours))d.err.hours='Enter between '+P.minHours+' and '+P.maxHours+' hours.';if(d.tripType!=='By the hour'&&!d.dest.trim())d.err.dest='Enter where the driver should take you.';
      if(d.when==='later'){var t=new Date(d.at).getTime();if(!d.at||isNaN(t))d.err.at='Choose a date and time.';else if(t<now())d.err.at='Choose a time in the future.'}
      if(Object.keys(d.err).length){render();return toast('Check the highlighted fields')}d.hours=hr}
    else{var q=Number(d.qty);if(!(q>=1&&q<=P.maxLitres))d.err.qty='Enter between 1 and '+P.maxLitres+' litres.';if(Object.keys(d.err).length)return render();d.qty=q}
    d.step=3;save();render();$('#main').scrollTop=0},
  confirmReq:function(){
    var d=S.draft,q=draftQuote(d),t=now(),drv=d.service==='driver';
    var r={service:d.service,id:'HFA-'+(++S.seq),custId:'C1',custName:S.user.name,custPhone:S.user.phone,vehicle:d.vehicle,fuel:drv?'':d.fuel,qty:drv?0:d.qty,unit:drv?'h':'L',
      tripType:drv?d.tripType:'',dest:drv&&d.tripType!=='By the hour'?d.dest:'',when:drv?d.when:'now',at:drv?d.at:'',hours:drv?Number(d.hours):0,transmission:drv?d.transmission:'',
      lat:d.lat,lng:d.lng,px:d.px,py:d.py,highway:d.highway,direction:drv?'':d.direction,exit:drv?'':d.exit,km:drv?'':d.km,landmark:d.landmark,notes:d.notes,
      fuelCost:q.fuelCost,serviceFee:q.serviceFee,returnFee:q.returnFee||0,distanceFee:q.distanceFee,total:q.total,dist:q.dist,
      status:'searching',providerId:null,payStatus:'pending',payMethod:null,rating:null,feedback:'',reviewHidden:false,createdAt:t,updatedAt:t,history:[{s:'searching',at:t}],
      eta:0,etaStart:0,radius:S.settings.radius,auto:S.settings.autopilot,messages:[],rejectedBy:[],cancelFee:0};
    S.requests.push(r);S.activeId=r.id;S.draft=null;S.screen='live';S.rateDraft=0;S.fbDraft='';save();render();toast((drv?'Booking ':'Request ')+r.id+' sent')},
  retry:function(el){var r=find(el.dataset.id);setStatus(r,'searching');r.auto=true;save();render()},
  expand:function(el){var r=find(el.dataset.id);r.radius+=10;r.expanded=true;r.auto=true;setStatus(r,'searching');save();render()},
  cancelReq:function(el){var r=find(el.dataset.id),fee=0,acc=null;r.history.forEach(function(x){if(x.s==='accepted')acc=x.at});
    if(r.status==='arrived')fee=S.pricing.cancelFee;else if(acc&&(now()-acc)/60000>S.pricing.freeCancelMin)fee=S.pricing.cancelFee;
    confirmBox({title:'Cancel this request?',body:fee?'A provider is on the way. A '+usd(fee)+' cancellation fee applies under the policy.':'No fee applies. You can request again at any time.',ok:'Cancel request',no:'Keep request',danger:true},function(){
      r.cancelFee=fee;r.payStatus=fee?'fee charged (demo)':'none';setStatus(r,'cancelled');S.activeId=null;S.screen='home';save();render();toast('Request cancelled')})},
  chat:function(el){openModal({type:'chat',id:el.dataset.id})},
  sendChat:function(el){var inp=$('#chatIn'),v=inp.value.trim();if(!v)return;var r=find(el.dataset.id);r.messages.push({from:S.role==='provider'?'p':'c',text:v,at:now()});save();renderModal();
    if(S.role==='customer'&&r.auto)setTimeout(function(){r.messages.push({from:'p',text:r.status==='arrived'?'I am at your location now.':'Got it. About '+Math.max(1,r.eta)+' min away.',at:now()});save();if(MODAL&&MODAL.type==='chat')renderModal()},1500)},
  payMethod:function(el){S.payMethod=el.dataset.v;PAY=null;render()},
  pay:function(el){var r=find(el.dataset.id);if(!navigator.onLine)return toast('You are offline. Connect to pay.');PAY='processing';render();setTimeout(function(){
    if(S.payDecline&&(S.payMethod||'card')!=='cash'){PAY='failed';render();return}
    var m=S.payMethod||'card';r.payStatus='paid';r.payMethod={card:'Card ending 4242 (demo)',wallet:'Digital wallet (demo)',cash:'Cash to provider'}[m];r.paidAt=now();PAY=null;save();render();toast('Payment confirmed. Receipt ready.')},1500)},
  rate:function(el){S.rateDraft=Number(el.dataset.v);render()},
  submitRating:function(el){var r=find(el.dataset.id);if(!S.rateDraft)return toast('Choose 1 to 5 stars');r.rating=S.rateDraft;r.feedback=(S.fbDraft||'').trim();r.rated=true;S.activeId=null;S.screen='home';save();render();toast('Thanks for rating your service')},
  skipRating:function(el){find(el.dataset.id).rated=true;S.activeId=null;S.screen='home';save();render()},
  viewReq:function(el){S.viewId=el.dataset.id;S.screen='detail';render()},
  support:function(){openModal({type:'support'})},
  sendSupport:function(){var v=$('#supIn').value.trim();if(!v)return toast('Describe the problem first');S.tickets.unshift({id:'T-'+(302+S.tickets.length),from:S.user.name,subject:v,req:'',status:'open',at:now()});save();closeModal();toast('Support request sent. We reply by email (demo).')},
  theme:function(el){S.theme=el.dataset.v;save();render()},
  reset:function(){confirmBox({title:'Reset sample data?',body:'All demo requests, settings and changes on this phone are replaced with the original sample data.',ok:'Reset',danger:true},function(){var role=S.role,sc=S.screen;S=seed();S.role=role;S.screen=sc;save();render();toast('Sample data reset')})},
  toggleOnline:function(el){var p=me();p.online=el.checked;save();render();toast(p.online?'You are online':'You are offline')},
  accept:function(el){
    var p=me(),r=find(el.dataset.id);
    if(p.verified!=='approved')return toast('Verification required before accepting requests');
    if(busy(p.id))return toast('Finish your current job first');
    // Guard against double acceptance. The real backend must do this in one conditional database update.
    if(!r||r.status!=='searching'||r.providerId){toast('Another provider already accepted this request');return render()}
    r.providerId=p.id;r.auto=false;r.dist=p.dist;r.eta=r.etaStart=etaFor(p.dist);setStatus(r,'accepted');save();render();toast('Request accepted. Customer details are now visible.')},
  reject:function(el){var r=find(el.dataset.id);r.rejectedBy.push(me().id);save();render();toast('Request declined')},
  advance:function(el){var r=find(el.dataset.id),to=el.dataset.to,drv=svc(r)==='driver';
    var go=function(){if(to==='travelling'){r.eta=r.etaStart=etaFor(r.dist)}setStatus(r,to);save();render();toast(LBL[svc(r)].p[to])};
    if(to==='completed')confirmBox({title:drv?'End this trip?':'Complete this service?',body:drv?'Confirm you have driven '+esc(r.custName)+' to the destination and returned the keys. The customer is then asked to pay.':'Confirm you delivered '+r.qty+' L of '+esc(r.fuel.toLowerCase())+' to '+esc(r.custName)+'. The customer is then asked to pay.',ok:drv?'End trip':'Complete service',no:'Not yet'},go);else go()},
  report:function(el){openModal({type:'report',id:el.dataset.id,rt:''})},
  repType:function(el){MODAL.rt=el.dataset.v;var n=$('#repNote')?$('#repNote').value:'';renderModal();$('#repNote').value=n},
  sendReport:function(){S.reports.unshift({providerId:me().id,req:MODAL.id,type:MODAL.rt,note:$('#repNote').value.trim(),at:now()});save();closeModal();render();toast('Report sent to the operations team')},
  upload:function(el){var p=me();p.docs[el.dataset.k]='pending';if(p.verified==='rejected')p.verified='pending';save();render();toast('File received for review (simulated)')},
  afilter:function(el){S.adminFilter=el.dataset.v;render()},
  refund:function(el){var r=find(el.dataset.id);confirmBox({title:'Refund '+r.id+'?',body:'Refund '+usd(r.status==='cancelled'?r.cancelFee:r.total)+' to '+esc(r.custName)+'. This demo does not move money.',ok:'Refund'},function(){r.payStatus='refunded (demo)';audit('Refunded '+r.id);save();render();toast('Refund recorded')})},
  approve:function(el){var p=prov(el.dataset.id);Object.keys(p.docs).forEach(function(k){p.docs[k]='approved'});p.verified='approved';audit('Approved documents for provider '+p.id+' ('+p.name+')');save();render();toast(p.name+' approved')},
  rejectProv:function(el){var p=prov(el.dataset.id);confirmBox({title:'Reject '+p.name+'?',body:'The provider cannot accept requests until they resubmit documents.',ok:'Reject',danger:true},function(){p.verified='rejected';p.online=false;audit('Rejected provider '+p.id+' ('+p.name+')');save();render()})},
  savePricing:function(){var keys=['petrol','diesel','serviceFee','perKm','cancelFee','freeCancelMin','maxLitres','driverHourly','driverBooking','driverReturn','minHours','maxHours'],vals={},bad=false;
    keys.forEach(function(k){var v=Number($('#pr-'+k).value);if(!(v>=0)||$('#pr-'+k).value==='')bad=true;vals[k]=v});var rad=Number($('#pr-radius').value);
    if(bad||!(rad>=1)||vals.maxLitres<1||vals.minHours<1||vals.maxHours<vals.minHours){$('#pr-err').innerHTML='<div class="notice err">Enter zero or a positive number in every field. Radius, max litres and minimum hours must be at least 1, and maximum hours cannot be below the minimum.</div>';return}

};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;if(TOUR&&el.dataset.act!=='stopTour')return toast('Tap Stop to take over');if(el.type==='checkbox'&&el.dataset.act!=='toggleOnline')return;var f=A[el.dataset.act];if(f)f(el,e)});

  if(el.dataset.bind&&(el.type==='checkbox'||el.tagName==='SELECT')){setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);save();if(el.dataset.bind==='settings.autopilot'||el.dataset.bind==='payDecline')PAY=null;return}

    r.providerId=p.id;r.dist=p.dist;r.eta=r.etaStart=etaFor(p.dist);setStatus(r,'accepted');audit('Assigned '+r.id+' to '+p.name);save();render();toast('Assigned to '+p.name)}
